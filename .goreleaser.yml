version: 2

project_name: zxcv

before:
  hooks:
    - go mod tidy

builds:
  - id: zxcv
    main: ./cmd/zxcv
    binary: zxcv
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: zxcv
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-snapshot"

changelog:
  sort: desc

release:
  draft: false
  prerelease: auto
